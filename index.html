<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的世界</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #172554, #0f766e);
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(700px, 85%);
      text-align: center;
      padding: 48px 28px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 24px;
    }

    h1 {
      font-size: 48px;
      margin: 0 0 16px;
    }

    p {
      font-size: 20px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <h1>欢迎来到我的世界</h1>
    <p>这是我的第一个网页。</p>
    <p>我正在学习 AI、GitHub 和制作自己的小工具。</p>
  </main>
</body>
</html>
